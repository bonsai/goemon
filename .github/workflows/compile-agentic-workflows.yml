name: Compile Agentic Workflows

on:
  push:
    branches:
      - automation/goemon-ci-monitor
    paths:
      - ".github/workflows/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-aw-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Install GitHub Agentic Workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw
          gh aw version

      - name: Compile workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --strict

      - name: Commit generated lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml .github/aw/actions-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Compile GitHub Agentic Workflows"
          git push
